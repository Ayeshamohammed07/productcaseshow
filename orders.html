<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Orders - Glam Luxe</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h2 style="color:white;">📦 My Orders</h2>
    <nav>
        <a href="index.html">Home</a>
        <a href="index.html#products">Products</a>
    </nav>
</header>

<section class="orders">
    <h2>Your Order History</h2>
    <div id="order-list"></div>
</section>

<script>
function loadOrders() {
    let orders = JSON.parse(localStorage.getItem("orders")) || [];
    let box = document.getElementById("order-list");

    box.innerHTML = "";

    if (orders.length === 0) {
        box.innerHTML = "<p>No orders yet 🛒</p>";
        return;
    }

    orders.forEach((order, i) => {
        box.innerHTML += `
            <div class="order-card">
                <h4>Order ${i + 1}</h4>
                <p><b>Product:</b> ${order.product || "Multiple Items"}</p>
                <p><b>Name:</b> ${order.name}</p>
                <p><b>Phone:</b> ${order.phone}</p>
                <p><b>Address:</b> ${order.address}</p>
                <p><b>Total:</b> ₹${order.total || order.price}</p>
                <p><b>Time:</b> ${order.time}</p>
            </div>
        `;
    });
}

window.onload = loadOrders;
</script>

</body>
</html>
